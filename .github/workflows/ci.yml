name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: duty
          POSTGRES_PASSWORD: duty
          POSTGRES_DB: duty_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U duty -d duty_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://duty:duty@localhost:5433/duty_test
      E2E_DATABASE_URL: postgres://duty:duty@localhost:5433/duty_e2e
      DATABASE_URL: postgres://duty:duty@localhost:5433/duty_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      # 솔버(services/solver): Python 3.12는 uv가 .python-version을 보고 받는다
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/solver/uv.lock
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:int
      - run: pnpm build
      # 운영 이미지(R-1): 모노레포 패키지가 빠지면 여기서 깨진다
      - run: docker build -f apps/web/Dockerfile --target runner -t duty-web .
      - run: docker build -f apps/web/Dockerfile --target tools -t duty-tools .
      - run: docker build -t duty-solver services/solver
      - run: docker build -t duty-backup deploy/backup
      # 운영 compose가 문법·필수 변수 검사를 통과하는지(값은 가짜)
      - run: docker compose -f compose.prod.yaml config -q
        env: { DOMAIN: example.com, POSTGRES_PASSWORD: x, BACKUP_AGE_RECIPIENT: age1x }
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright
          path: apps/web/test-results

  # Build Spec 3-3 — main push에서 검사가 통과하면 운영에 배포한다. 저장소 변수가 없으면(설정 전·포크) 건너뛴다
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    # 배포는 한 번에 하나, 진행 중인 배포는 끊지 않는다(뒤 커밋은 차례를 기다린다)
    concurrency: { group: deploy-production, cancel-in-progress: false }
    environment: production
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      # 새 커밋의 deploy.sh를 표준 입력으로 보내 서버에서 root로 돌린다. SSH 키는 30분 뒤 만료.
      # 끝 표시(deploy_ok·deploy_skip·deploy_docs_only)가 없으면 중간에 멈춘 것으로 보고 실패시킨다
      - run: |
          gcloud compute ssh duty-vm --tunnel-through-iap --quiet \
            --project "${{ vars.GCP_PROJECT }}" --zone "${{ vars.GCP_ZONE }}" \
            --ssh-key-expire-after=30m --strict-host-key-checking=no \
            --command "sudo bash -s -- ${{ github.sha }}" < deploy/deploy.sh 2>&1 | tee deploy.log
          grep -qE '^deploy_(ok|skip|docs_only) ' deploy.log
      - run: curl -fsS -o /dev/null -w '%{http_code}\n' https://offplz.com/api/health
