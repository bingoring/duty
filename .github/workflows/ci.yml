name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: duty
          POSTGRES_PASSWORD: duty
          POSTGRES_DB: duty_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U duty -d duty_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://duty:duty@localhost:5433/duty_test
      E2E_DATABASE_URL: postgres://duty:duty@localhost:5433/duty_e2e
      DATABASE_URL: postgres://duty:duty@localhost:5433/duty_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:int
      - run: pnpm build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright
          path: apps/web/test-results
