name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: duty
          POSTGRES_PASSWORD: duty
          POSTGRES_DB: duty_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U duty -d duty_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://duty:duty@localhost:5433/duty_test
      E2E_DATABASE_URL: postgres://duty:duty@localhost:5433/duty_e2e
      DATABASE_URL: postgres://duty:duty@localhost:5433/duty_test
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # 문서(docs/waypoint 포함)만 바뀐 커밋은 E2E를 건너뛴다(배포도 deploy_docs_only라 앱이 바뀌지 않는다).
      # 판단 기준은 아래 deploy-cloudrun의 RUNTIME과 같고, CI 설정(.github/)이 바뀌면 모두 돈다
      - id: changes
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then BASE="${{ github.event.pull_request.base.sha }}"; else BASE="${{ github.event.before }}"; fi
          RUNTIME='^(apps/|packages/|services/|firebase\.json|deploy/cloudrun/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.nvmrc|\.github/)'
          if git cat-file -e "$BASE^{commit}" 2>/dev/null && ! git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qE "$RUNTIME"; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "문서만 바뀜 — E2E 건너뜀"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      # 솔버(services/solver): Python 3.12는 uv가 .python-version을 보고 받는다
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/solver/uv.lock
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:int
      - run: pnpm build
      # 운영 이미지(R-1): 모노레포 패키지가 빠지면 여기서 깨진다
      - run: docker build -f apps/web/Dockerfile --target runner -t duty-web .
      - run: docker build -f apps/web/Dockerfile --target tools -t duty-tools .
      - run: docker build -t duty-solver services/solver
      - run: pnpm --filter web exec playwright install --with-deps chromium
        if: steps.changes.outputs.docs_only != 'true'
      - run: pnpm test:e2e
        if: steps.changes.outputs.docs_only != 'true'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright
          path: apps/web/test-results

  # 3-13: main push에서 검사가 통과하면 Cloud Run + Firebase Hosting에 배포한다. 저장소 변수가 없으면(설정 전·포크) 건너뛴다.
  # 자원과 첫 배포는 deploy/gcp/serverless.sh가 만든다(이 잡은 이미지·리비전만 바꾼다)
  deploy-cloudrun:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    concurrency: { group: deploy-production, cancel-in-progress: false }
    environment: production
    permissions: { contents: read, id-token: write }
    env:
      PROJECT: ${{ vars.GCP_PROJECT }}
      REGION: asia-northeast3
      SHA: ${{ github.sha }}
      AR: asia-northeast3-docker.pkg.dev/${{ vars.GCP_PROJECT }}/duty
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      # 1) 지금 트래픽을 받는 web 리비전의 커밋(label commit-sha)과 비교해 실행에 쓰이는 파일이 안 바뀌었으면 빌드하지 않는다.
      #    서비스 라벨이 아니라 리비전을 본다 — 헬스 실패로 트래픽을 못 옮긴 커밋을 「이미 배포됨」으로 보지 않게
      - id: diff
        run: |
          REV=$(gcloud run services describe duty-web --project "$PROJECT" --region "$REGION" --format=json 2>/dev/null |
            jq -r '[.status.traffic[] | select(.percent > 0)][0].revisionName // empty' || true)
          PREV=""
          [ -z "$REV" ] || PREV=$(gcloud run revisions describe "$REV" --project "$PROJECT" --region "$REGION" \
            --format='value(metadata.labels.commit-sha)' 2>/dev/null || true)
          RUNTIME='^(apps/|packages/|services/|firebase\.json|deploy/cloudrun/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.nvmrc)'
          if [ -n "$PREV" ] && git cat-file -e "$PREV^{commit}" 2>/dev/null && ! git diff --name-only "$PREV" "$SHA" | grep -qE "$RUNTIME"; then
            echo "deploy_docs_only $PREV → $SHA"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # 2) 이미지 빌드 → Artifact Registry(태그 = 커밋 SHA)
      - if: steps.diff.outputs.skip != 'true'
        run: |
          gcloud auth configure-docker asia-northeast3-docker.pkg.dev --quiet
          docker build -f apps/web/Dockerfile --target runner -t "$AR/web:$SHA" .
          docker build -f apps/web/Dockerfile --target tools -t "$AR/tools:$SHA" .
          docker build -t "$AR/solver:$SHA" services/solver
          docker push "$AR/web:$SHA" && docker push "$AR/tools:$SHA" && docker push "$AR/solver:$SHA"
      # 3) 마이그레이션 Job(실패하면 여기서 멈춘다). 배포 전 백업은 Cloud SQL 원하는 시점 복구로 대신한다
      - if: steps.diff.outputs.skip != 'true'
        run: |
          gcloud run jobs update duty-migrate --project "$PROJECT" --region "$REGION" --image "$AR/tools:$SHA"
          gcloud run jobs execute duty-migrate --project "$PROJECT" --region "$REGION" --wait
      # 4) 새 리비전은 트래픽 없이 올리고(태그 URL만 생김), web 태그 URL 헬스가 통과해야 트래픽을 옮긴다.
      #    솔버는 비공개라 태그 URL을 부르지 않는다 — 리비전이 준비되지 않으면 deploy가 실패한다
      - if: steps.diff.outputs.skip != 'true'
        run: |
          TAG="c${SHA:0:7}"
          gcloud run deploy duty-solver --project "$PROJECT" --region "$REGION" --image "$AR/solver:$SHA" \
            --update-labels "commit-sha=$SHA" --no-traffic --tag "$TAG"
          gcloud run deploy duty-web --project "$PROJECT" --region "$REGION" --image "$AR/web:$SHA" \
            --update-labels "commit-sha=$SHA" --no-traffic --tag "$TAG"
          URL=$(gcloud run services describe duty-web --project "$PROJECT" --region "$REGION" --format=json |
            jq -r --arg t "$TAG" '.status.traffic[] | select(.tag == $t) | .url')
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null -w '%{http_code}\n' "$URL/api/health"
          gcloud run services update-traffic duty-solver --project "$PROJECT" --region "$REGION" --to-latest --clear-tags
          gcloud run services update-traffic duty-web --project "$PROJECT" --region "$REGION" --to-latest --clear-tags
      # 5) Hosting을 매번 배포해 Firebase CDN 캐시를 비운다(지운 청크를 가리키는 옛 페이지가 남지 않게)
      - if: steps.diff.outputs.skip != 'true'
        run: npx --yes firebase-tools@14 deploy --only hosting --project "$PROJECT" --non-interactive
      - run: curl -fsS --retry 3 --retry-delay 5 -o /dev/null -w '%{http_code}\n' https://offplz.com/api/health
