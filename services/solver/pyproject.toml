[project]
name = "duty-solver"
version = "0.1.0"
description = "duty 근무표 CP-SAT 솔버 (무상태 서비스, Build Spec 2-6)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "ortools>=9.15,<10",
  "pydantic>=2.9",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.8",
  "datamodel-code-generator>=0.26",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["solver/contract.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
